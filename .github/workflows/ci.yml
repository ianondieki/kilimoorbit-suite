name: sentinel-ci
on:
  push:
    branches: [main]
    paths: ["kilimoorbit-sentinel/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["kilimoorbit-sentinel/**", ".github/workflows/ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kilimoorbit-sentinel
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: kilimoorbit-sentinel/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          APEX_MOCK: "1"
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kilimoorbit-sentinel ./kilimoorbit-sentinel
