name: mobile-ci
on:
  push:
    branches: [main]
    paths: ["kilimoorbit-mobile/**", "kilimoorbit-sentinel/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["kilimoorbit-mobile/**", "kilimoorbit-sentinel/**", ".github/workflows/mobile-ci.yml"]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            kilimoorbit-mobile/package-lock.json
            kilimoorbit-sentinel/package-lock.json
      - run: npm ci
        working-directory: kilimoorbit-sentinel
      - run: npm ci
        working-directory: kilimoorbit-mobile
      - run: npm run typecheck
        working-directory: kilimoorbit-mobile
      - run: npx playwright install --with-deps chromium
        working-directory: kilimoorbit-mobile
      # Boots the Sentinel server (mock engine) and a static web export, then
      # runs the farmer flows at phone and desktop widths.
      - run: npm run e2e
        working-directory: kilimoorbit-mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: kilimoorbit-mobile/playwright-report
          retention-days: 7
